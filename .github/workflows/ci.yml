# Build and test on both OSes CupriCut promises pixel determinism on.
#
# The one thing worth knowing about this file: the CupriFace package lives on GitHub Packages,
# which will not serve even a public package anonymously. CI has the built-in GITHUB_TOKEN, so the
# credential steps below are all that is needed - but without them every job fails at restore with
# a package-not-found that names no reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Authenticate to GitHub Packages
        shell: bash
        run: |
          dotnet nuget update source GitHub-Wixely-Packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore CupriCut.sln

      - name: Build
        run: dotnet build CupriCut.sln -c Release --no-restore

      - name: Test
        run: dotnet test CupriCut.sln -c Release --no-build --verbosity normal

      # A render that only ever ran on the developer's laptop is not evidence. This walks the whole
      # pipeline the way a user does - the CLI over the shipped example composition - and fails the
      # job if the PNG is missing or suspiciously small.
      - name: Render the example composition
        shell: bash
        run: |
          dotnet run --project cli/CupriCut.Cli.csproj -c Release --no-build -- \
            sheet --composition lower-third.html --duration 2 --count 6 \
            --out ci-sheet.png --content-root "$PWD/bin/Release/net10.0"
          sheet="bin/Release/net10.0/output/ci-sheet.png"
          test -f "$sheet" || { echo "no contact sheet was produced"; exit 1; }
          size=$(wc -c < "$sheet")
          echo "contact sheet: $size bytes"
          test "$size" -gt 5000 || { echo "contact sheet is implausibly small"; exit 1; }

      # Publishing is a DIFFERENT build from the one above, and it broke without a single test
      # noticing: the CLI references the server project, and two executables where one references
      # the other must agree about self-containment once a RuntimeIdentifier is present, or the SDK
      # refuses with NETSDK1151. `dotnet build` never hits it, so the whole suite passed while both
      # the release workflow and the Dockerfile could not produce a binary at all.
      #
      # This runs the PUBLISHED binary rather than the build output, so the next thing of that shape
      # fails on the commit that causes it rather than on a release tag.
      - name: Publish and run the published binary
        shell: bash
        run: |
          set -euo pipefail
          rid=$([ "${{ runner.os }}" = "Windows" ] && echo win-x64 || echo linux-x64)
          for proj in CupriCut.csproj cli/CupriCut.Cli.csproj; do
            dotnet publish "$proj" -c Release -r "$rid" \
              --self-contained false -p:CupriCutSelfContained=false \
              -o ci-publish -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          done
          cd ci-publish
          exe=$([ "${{ runner.os }}" = "Windows" ] && echo ./CupriCut.Cli.exe || echo ./CupriCut.Cli)
          "$exe" fonts
          "$exe" sheet --composition lower-third.html --duration 2 --count 4 --out published.png
          size=$(wc -c < output/published.png)
          echo "published binary rendered $size bytes"
          test "$size" -gt 5000 || { echo "::error::the published binary rendered an implausibly small sheet"; exit 1; }

      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet-${{ matrix.os }}
          path: bin/Release/net10.0/output/ci-sheet.png
          if-no-files-found: error

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only, no push: the point here is that the image still assembles - ffmpeg included -
      # not that it is published. Publishing happens on a tag.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          secrets: |
            NUGET_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
