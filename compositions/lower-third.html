<!--
  A broadcast lower third: the bar wipes in, the text rises behind it, an accent rule draws across,
  and the whole thing holds. Three seconds, and every bit of it driven by @keyframes - so this
  composition is pure in t and would render the same swept or sampled.

  The font is registered by the server (Cut:FontDirectories), not resolved from the machine. Under
  FontPolicy.RegisteredOnly a family nothing covers is an error naming the family, so "Noto Sans"
  here means the file in fonts/, on every machine.

  The gradient behind it is marked --cupricut-background, so the SAME file gives an opaque clip to
  review and a transparent one to drop over footage: render with showBackground:false, or untick
  Background in the window. It is its own element rather than a background on .stage because
  hiding .stage would take the layout with it.
-->
<div class="stage">
  <div --cupricut-background="studio gradient" class="backdrop"></div>

  <div class="third">
    <div class="bar">
      <div class="text">
        <div class="name">Ada Lovelace</div>
        <div class="role">Analytical Engine &middot; Note G</div>
      </div>
    </div>
    <div class="rule"></div>
  </div>
</div>

<style>
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    font-family: "Noto Sans";
    position: relative;
  }

  .backdrop {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #10131a 0%, #1d2432 100%);
  }

  .third {
    margin: 0 0 96px 96px;
    position: relative;
  }

  /* The bar wipes open from the left. Animating width means layout re-runs, which is what makes
     the text behind it reveal rather than squash. */
  .bar {
    height: 104px;
    overflow: hidden;
    background: #f4f6fb;
    border-radius: 4px;
    animation: wipe 0.55s ease-out both;
  }

  .text {
    padding: 18px 32px;
    width: 520px;
    animation: rise 0.6s ease-out 0.25s both;
  }

  .name {
    font-size: 34px;
    font-weight: 700;
    color: #10131a;
    letter-spacing: -0.4px;
  }

  .role {
    font-size: 17px;
    color: #5a6478;
    margin-top: 6px;
  }

  .rule {
    height: 5px;
    margin-top: 10px;
    border-radius: 3px;
    background: #d9642a;
    animation: draw 0.7s ease-out 0.45s both;
  }

  @keyframes wipe {
    from { width: 0; }
    to   { width: 584px; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes draw {
    from { width: 0; opacity: 0; }
    to   { width: 584px; opacity: 1; }
  }
</style>
