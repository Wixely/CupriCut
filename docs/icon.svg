<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="CupriCut">
  <title>CupriCut</title>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="0.7" y2="1.3">
      <stop offset="0.0" stop-color="#F7B562"/>
      <stop offset="0.5" stop-color="#D9642A"/>
      <stop offset="1.0" stop-color="#9E3A12"/>
    </linearGradient>
    <clipPath id="above"><polygon points="-768,645.306 768,-241.504 768,-768 -768,-768"/></clipPath>
    <clipPath id="below"><polygon points="-768,645.306 768,-241.504 768,768 -768,768"/></clipPath>
  </defs>

  <!-- One frame, cut once, the halves parted perpendicular to the cut. -->
  <g clip-path="url(#above)">
    <rect x="30" y="30" width="196" height="196" rx="48"
          fill="url(#copper)" transform="translate(-5.000 -8.660)"/>
  </g>
  <g clip-path="url(#below)">
    <rect x="30" y="30" width="196" height="196" rx="48"
          fill="url(#copper)" transform="translate(5.000 8.660)"/>
  </g>
</svg>
