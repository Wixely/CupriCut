<!--
  Three scenes, one after another. Nine seconds.

  What this one is for: THE TIMELINE. Everything else here is a single continuous motion; this is a
  composition that is a SEQUENCE. data-start and data-duration say when each scene is on screen,
  data-track names the row it belongs to, and CupriCut generates the window that puts it there.

  Two rules, and both are the engine's rather than choices:

  1. A TIMED ELEMENT'S OWN `animation` BELONGS TO CUPRICUT. The engine runs exactly one animation
     per element - comma-separated lists do nothing - so the generated window and an author's
     animation cannot share one. Put the motion on a child, which is the natural shape anyway: the
     timed thing is a scene, and the scene is not what moves.

  2. A LATE SCENE NEEDS `var(--cut-start)`. The engine's clock is absolute and stamps no creation
     time, so a child of a scene that appears at 3s would otherwise have played its entrance at 0
     and be sitting still by the time anyone saw it. Each scene publishes --cut-start, custom
     properties inherit, and a child writes `animation-delay: var(--cut-start)` to begin when its
     scene does.

     `calc(var(--cut-start) + 0.2s)` is the obvious next thing to want and does NOT work - calc() is
     not supported in animation-delay at all. Stagger inside a scene goes in the keyframe
     percentages, which is what .two and .three below do.

  The scenes overlay rather than stacking: each is position:absolute and fills the frame, so the one
  whose window is open is simply the one you can see. A scene in normal flow would leave a gap where
  its neighbours are not.
-->
<div class="stage">
  <div --cupricut-background class="backdrop"></div>

  <div class="scene" data-start="0" data-duration="3" data-track="main">
    <div class="eyebrow">ONE COMPOSITION</div>
    <div class="big">Three scenes.</div>
    <div class="rule"></div>
  </div>

  <div class="scene" data-start="3" data-duration="3" data-track="main">
    <div class="eyebrow stagger">DATA-START</div>
    <div class="big stagger">Nine seconds.</div>
    <div class="rule stagger"></div>
  </div>

  <div class="scene" data-start="6" data-duration="3" data-track="main">
    <div class="eyebrow stagger">STILL PURE IN T</div>
    <div class="big stagger">No browser.</div>
    <div class="rule stagger"></div>
  </div>
</div>

<style>
  :root {
    --bg-top: #0b0e14;
    --bg-bottom: #171f2e;
    --ink: #f4f6fb;
    --muted: #8d9ab3;
    --accent: #d9642a;
    --font: "Noto Sans";
  }

  .stage {
    width: 100%;
    height: 100%;
    position: relative;
    font-family: var(--font);
  }

  .backdrop {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  }

  /* Each scene fills the frame and they overlay, so the open window is the one you see.
     No `animation` here - that slot is the timeline's. */
  .scene {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }

  .eyebrow {
    position: absolute;
    left: 120px;
    top: 250px;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .big {
    position: absolute;
    left: 120px;
    top: 288px;
    font-size: 86px;
    font-weight: 700;
    color: var(--ink);
  }

  .rule {
    position: absolute;
    left: 120px;
    top: 420px;
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
  }

  /* Scene one opens the film, so it plays from the absolute zero it already has. */
  .scene .eyebrow { animation: rise 0.6s ease-out both; }
  .scene .big     { animation: rise 0.7s ease-out both; }
  .scene .rule    { animation: sweep 0.8s ease-out both; }

  /* Scenes two and three appear late, so theirs start when their scene does. The stagger that
     would have been three different delays lives in the keyframe percentages instead. */
  .stagger.eyebrow { animation: riseLate 1.1s ease-out var(--cut-start) both; }
  .stagger.big     { animation: riseLate 1.3s ease-out var(--cut-start) both; }
  .stagger.rule    { animation: sweepLate 1.6s ease-out var(--cut-start) both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes sweep {
    from { width: 0; opacity: 0; }
    to   { width: 420px; opacity: 1; }
  }

  /* The first fifth is the hold that staggers this behind the one before it. */
  @keyframes riseLate {
    0%   { opacity: 0; transform: translateY(32px); }
    18%  { opacity: 0; transform: translateY(32px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes sweepLate {
    0%   { width: 0; opacity: 0; }
    34%  { width: 0; opacity: 0; }
    100% { width: 420px; opacity: 1; }
  }
</style>
