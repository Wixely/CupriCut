<!--
  A big number landing, with the bar that earned it.

  What this one is for: SEQUENCING. Nothing here happens at the same time as anything else. The
  card lifts, the bar draws, the number arrives as the bar lands, the caption follows. Every one of
  those is the same handful of @keyframes on a different animation-delay, which is the one mechanism
  the engine gives you for "this, then that" - and it carries far more than it looks like it will.

  The order is the design. A number that appears before its bar has finished is a number nobody
  believes; a number that lands ON the finish reads as the result of it.

  What is NOT here, and why: a ticking odometer - a 0-9 column sliding inside overflow:hidden - was
  the first draft of this file and does not work on this engine. Clipping a transformed child, and
  absolutely positioning inside a nested positioned box, both behave differently from a browser.
  Both are written down in PLAN.md as things to pin down against the engine rather than guessed at,
  and this file stays on ground that is measured.
-->
<div class="stage">
  <div --cupricut-background class="backdrop"></div>

  <div class="card">
    <div class="eyebrow">FRAMES RENDERED</div>
    <div class="number">382,914</div>
    <div class="track"><div class="fill"></div></div>
    <div class="caption">one laptop, no browser, no render farm</div>
  </div>
</div>

  .card {
